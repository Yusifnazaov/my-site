<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Qiymət Təklifi</title>
    <style>
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="printArea" style="padding: 15px; background: white;">
        <table width="100%">
            <tr>
                <td>
                    <h2>RM Steel MMC</h2>
                    <p>Əsl poladın ünvanı!<br>
                    Bakı ş., Dərnəgül pr., Grand bazar<br>
                    Email: info@rmsteel.az | Tel: +994 10 600 09 01</p>
                </td>
                <td align="right" valign="top">
                    <h1>QİYMƏT TƏKLİFİ</h1>
                    <p>Tarix: <input type="date" id="docDate" value="2026-08-08"><br>
                    Təklif №: <input type="text" id="docNo"></p>
                </td>
            </tr>
        </table>
        <p><b>Müştəri:</b> <input type="text" id="clientName" style="width: 300px;"></p>
        <table border="1" cellspacing="0" cellpadding="5" width="100%">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Malların adı</th>
                    <th>Ölçü vahidi</th>
                    <th>Miqdar</th>
                    <th>Qiymət</th>
                    <th>Məbləğ (AZN)</th>
                    <th>Qeydlər</th>
                    <th class="no-print"></th>
                </tr>
            </thead>
            <tbody id="rows">
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="5" align="right"><b>Cəmi:</b></td>
                    <td id="total">0.00</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>
    </div>
    <br>
    <div class="no-print" style="margin-bottom: 20px;">
        <button onclick="add()">+ Yeni sətir</button>
        <button onclick="saveData()" style="background: #28a745; color: white; padding: 6px 16px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px;">💾 Yadda saxla</button>
        <button onclick="clearData()" style="background: #dc3545; color: white; padding: 6px 16px; border: none; cursor: pointer; border-radius: 4px;">Sıfırla</button>
    </div>

    <script>
        // Səhifə yüklənəndə məlumatları bərpa et
        window.onload = function() {
            loadData();
        };

        function calc() {
            let trs = document.querySelectorAll('#rows tr'), sum = 0;
            trs.forEach(tr => {
                let q = parseFloat(tr.querySelector('.q').value) || 0;
                let p = parseFloat(tr.querySelector('.p').value) || 0;
                let a = q * p;
                tr.querySelector('.a').innerText = a.toFixed(2);
                sum += a;
            });
            document.getElementById('total').innerText = sum.toFixed(2);
        }

        function add(name = '', unit = 'Metr', q = 0, p = 0, note = '') {
            let tbody = document.getElementById('rows');
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td align="center" class="num"></td>
                <td><input type="text" class="item-name" value="${name}" style="width:95%"></td>
                <td><input type="text" class="item-unit" value="${unit}" style="width:95%"></td>
                <td><input type="number" step="any" value="${q}" class="q" oninput="calc()"></td>
                <td><input type="number" step="any" value="${p}" class="p" oninput="calc()"></td>
                <td class="a">0.00</td>
                <td><input type="text" class="item-note" value="${note}" style="width:95%"></td>
                <td class="no-print"><button onclick="del(this)">X</button></td>
            `;
            tbody.appendChild(tr);
            renumber();
            calc();
        }

        function del(btn) {
            btn.closest('tr').remove();
            renumber();
            calc();
        }

        function renumber() {
            document.querySelectorAll('#rows tr').forEach((tr, i) => {
                tr.querySelector('.num').innerText = i + 1;
            });
        }

        // Məlumatları brauzer yaddaşında (localStorage) saxlamaq
        function saveData() {
            const rowsData = [];
            document.querySelectorAll('#rows tr').forEach(tr => {
                rowsData.push({
                    name: tr.querySelector('.item-name').value,
                    unit: tr.querySelector('.item-unit').value,
                    q: tr.querySelector('.q').value,
                    p: tr.querySelector('.p').value,
                    note: tr.querySelector('.item-note').value
                });
            });

            const formData = {
                docDate: document.getElementById('docDate').value,
                docNo: document.getElementById('docNo').value,
                clientName: document.getElementById('clientName').value,
                rows: rowsData
            };

            localStorage.setItem('rm_steel_proposal', JSON.stringify(formData));
            alert('Məlumatlar uğurla yadda saxlanıldı!');
        }

        // Yadda saxlanılmış məlumatları yükləmək
        function loadData() {
            const savedData = localStorage.getItem('rm_steel_proposal');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('docDate').value = data.docDate || '2026-08-08';
                document.getElementById('docNo').value = data.docNo || '';
                document.getElementById('clientName').value = data.clientName || '';

                document.getElementById('rows').innerHTML = '';
                if (data.rows && data.rows.length > 0) {
                    data.rows.forEach(r => add(r.name, r.unit, r.q, r.p, r.note));
                } else {
                    add('Boru şovlu 20', 'Metr', 210, 1.44, '');
                }
            } else {
                add('Boru şovlu 20', 'Metr', 210, 1.44, '');
            }
        }

        // Formanı sıfırlamaq üçün köməkçi funksiya
        function clearData() {
            if (confirm("Yadda saxlanılmış məlumatları silmək və sıfırlamaq istədiyinizdən əminsiniz?")) {
                localStorage.removeItem('rm_steel_proposal');
                location.reload();
            }
        }
    </script>
</body>
</html>
