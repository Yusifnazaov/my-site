<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiymət Təklifi Sistemi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f6f8; --side-bg: #2c3e50; --side-text: #ecf0f1; --main-bg: #fff;
            --text: #333; --border: #ddd; --primary: #3498db; --hover: #2980b9;
            --danger: #e74c3c; --success: #2ecc71; --doc-bg: #fff;
        }
        [data-theme="dark"] {
            --bg: #121212; --side-bg: #1e1e1e; --side-text: #ddd; --main-bg: #1e1e1e;
            --text: #eee; --border: #444; --primary: #375a7f; --hover: #2b4764;
            --doc-bg: #2a2a2a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; transition: background 0.3s; }
        
        /* Layout */
        .sidebar { width: 300px; background: var(--side-bg); color: var(--side-text); display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar-header { padding: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .search-box { padding: 15px; }
        .search-box input { width: 100%; padding: 8px; border: none; border-radius: 4px; outline: none; }
        .quote-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .quote-item { padding: 15px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .quote-item:hover, .quote-item.active { background: var(--primary); }
        .quote-item .id { font-weight: bold; font-size: 0.9rem; }
        .quote-item .client { font-size: 0.8rem; opacity: 0.8; margin-top: 5px; }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 10px 20px; background: var(--main-bg); border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .toolbar-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; background: var(--primary); color: #fff; font-size: 0.9rem; transition: transform 0.1s, opacity 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn:hover { opacity: 0.9; }
        .btn.danger { background: var(--danger); }
        .btn.success { background: var(--success); }
        .btn.icon { padding: 8px 10px; }
        
        .doc-wrapper { flex: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; }
        .document { width: 100%; max-width: 800px; background: var(--doc-bg); padding: 40px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 5px; }
        
        /* Document Styles */
        .doc-header { display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 20px; }
        .company-info { max-width: 50%; }
        .company-info img { max-height: 80px; max-width: 200px; margin-bottom: 10px; object-fit: contain; cursor: pointer; }
        .company-info .c-name { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .doc-meta { text-align: right; }
        .doc-meta h1 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; letter-spacing: 1px; }
        
        .client-section { margin-bottom: 30px; background: rgba(0,0,0,0.02); padding: 15px; border-left: 4px solid var(--primary); border-radius: 0 5px 5px 0; }
        .input-group { margin-bottom: 8px; display: flex; align-items: center; }
        .input-group label { width: 100px; font-weight: bold; font-size: 0.9rem; }
        
        input, textarea, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); outline: none; }
        input.transparent { border: 1px dashed transparent; padding: 2px; }
        input.transparent:hover, input.transparent:focus { border-color: var(--border); }
        
        .table-responsive { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; font-size: 0.9rem; }
        th { background: var(--primary); color: #fff; font-weight: 500; }
        td input { border: none; width: 100%; padding: 4px; background: transparent; color: var(--text); }
        .col-num { width: 30px; cursor: grab; text-align: center; }
        .col-action { width: 40px; text-align: center; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        
        .totals { display: flex; justify-content: flex-end; margin-top: 20px; }
        .totals-box { width: 300px; border: 1px solid var(--border); border-radius: 5px; }
        .total-row { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid var(--border); }
        .total-row:last-child { border-bottom: none; font-weight: bold; background: rgba(52, 152, 219, 0.1); font-size: 1.1rem; }
        
        /* Modal & Toasts */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--main-bg); padding: 25px; border-radius: 8px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-bottom: 15px; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--success); color: #fff; padding: 10px 20px; border-radius: 5px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
        
        /* Print & PDF Mode */
        @media print, .pdf-mode {
            body { background: #fff !important; }
            .sidebar, .toolbar, .btn-add, .col-action, .btn-del { display: none !important; }
            .main { overflow: visible; display: block; }
            .doc-wrapper { padding: 0; display: block; overflow: visible; }
            .document { max-width: 100%; box-shadow: none; padding: 0; margin: 0; border-radius: 0; }
            input.transparent { border: none !important; }
        }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; flex-shrink: 0; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .company-info img { max-width: 120px; }
            .doc-header { flex-direction: column; gap: 20px; }
            .doc-meta { text-align: left; }
        }
    </style>
</head>
<body>

    <!-- Autocomplete Datalists -->
    <datalist id="clients-list"></datalist>
    <datalist id="products-list"></datalist>

    <div class="sidebar hide-print">
        <div class="sidebar-header">Qaimə Sistemi</div>
        <div class="search-box">
            <button class="btn" style="width:100%; margin-bottom:10px;" onclick="createNewQuote()">+ Yeni Qaimə</button>
            <input type="text" id="searchInput" placeholder="Axtarış (Müştəri, №, Mal)..." oninput="renderSidebar()">
        </div>
        <div class="quote-list" id="quoteList"></div>
    </div>

    <div class="main">
        <div class="toolbar hide-print">
            <div class="toolbar-group">
                <button class="btn success" onclick="saveCurrentQuote(true)">Yadda Saxla</button>
                <button class="btn icon" onclick="undo()" title="Geri (Undo)">↩️</button>
                <button class="btn icon" onclick="redo()" title="İrəli (Redo)">↪️</button>
                <button class="btn" onclick="duplicateQuote()">Kopyala</button>
                <button class="btn danger" onclick="deleteCurrentQuote()">Sil</button>
            </div>
            <div class="toolbar-group">
                <button class="btn" onclick="window.print()">Çap Et</button>
                <button class="btn" onclick="exportPDF()">PDF İxrac</button>
                <button class="btn" onclick="exportExcel()">Excel İxrac</button>
                <button class="btn" onclick="openSettings()">Ayarlar</button>
                <button class="btn icon" onclick="toggleTheme()" title="Gecə/Gündüz">🌓</button>
                <button class="btn icon" onclick="exportJSON()" title="Yedəklə (JSON)">💾</button>
                <button class="btn icon" onclick="document.getElementById('importFile').click()" title="Bərpa Et (JSON)">📂</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
            </div>
        </div>

        <div class="doc-wrapper">
            <div class="document" id="print-area">
                <div class="doc-header">
                    <div class="company-info">
                        <img id="c_logo_img" src="" alt="Logo" style="display:none;" onclick="openSettings()">
                        <div class="c-name"><input type="text" id="c_name" class="transparent" placeholder="Şirkət Adı" oninput="autoSave()"></div>
                        <div><input type="text" id="c_address" class="transparent" placeholder="Ünvan" oninput="autoSave()"></div>
                        <div><input type="text" id="c_phone" class="transparent" placeholder="Telefon" oninput="autoSave()"></div>
                        <div><input type="text" id="c_email" class="transparent" placeholder="Email" oninput="autoSave()"></div>
                    </div>
                    <div class="doc-meta">
                        <h1>QİYMƏT TƏKLİFİ</h1>
                        <div class="input-group" style="justify-content: flex-end;">
                            <label>Tarix:</label>
                            <input type="date" id="q_date" class="transparent" style="width:auto;" oninput="autoSave()">
                        </div>
                        <div class="input-group" style="justify-content: flex-end;">
                            <label>Təklif №:</label>
                            <input type="text" id="q_id" class="transparent" style="width:auto; font-weight:bold; color:var(--primary);" readonly>
                        </div>
                    </div>
                </div>

                <div class="client-section">
                    <div class="input-group">
                        <label>Müştəri Adı:</label>
                        <input type="text" id="cl_name" list="clients-list" class="transparent" placeholder="Müştəri adını daxil edin..." oninput="handleClientInput(this.value)">
                    </div>
                    <div class="input-group">
                        <label>Telefon:</label>
                        <input type="text" id="cl_phone" class="transparent" placeholder="..." oninput="autoSave()">
                    </div>
                    <div class="input-group">
                        <label>Ünvan:</label>
                        <input type="text" id="cl_address" class="transparent" placeholder="..." oninput="autoSave()">
                    </div>
                    <div class="input-group">
                        <label>Qeyd:</label>
                        <input type="text" id="cl_note" class="transparent" placeholder="..." oninput="autoSave()">
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="items-table">
                        <thead>
                            <tr>
                                <th class="col-num">#</th>
                                <th>Malın adı</th>
                                <th style="width:80px;">Ölçü</th>
                                <th style="width:80px;">Miqdar</th>
                                <th style="width:100px;">Qiymət</th>
                                <th style="width:100px;">Məbləğ</th>
                                <th>Qeydlər</th>
                                <th class="col-action"></th>
                            </tr>
                        </thead>
                        <tbody id="items-tbody"></tbody>
                    </table>
                    <button class="btn btn-add" style="margin-top: 10px;" onclick="addRow()">+ Sətir Əlavə Et</button>
                </div>

                <div class="totals">
                    <div class="totals-box">
                        <div class="total-row">
                            <span>Cəmi:</span>
                            <span id="t_subtotal">0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Yekun:</span>
                            <span id="t_total">0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Şirkət Ayarları</h3>
            <div class="input-group"><label>Logo:</label><input type="file" accept="image/*" onchange="uploadLogo(event)"></div>
            <div class="input-group"><label>Şirkət Adı:</label><input type="text" id="set_name"></div>
            <div class="input-group"><label>Ünvan:</label><input type="text" id="set_addr"></div>
            <div class="input-group"><label>Telefon:</label><input type="text" id="set_phone"></div>
            <div class="input-group"><label>Email:</label><input type="text" id="set_email"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn success" style="flex:1" onclick="saveSettings()">Yadda Saxla</button>
                <button class="btn" style="flex:1" onclick="closeSettings()">Bağla</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // IndexedDB Wrapper
        const DB_NAME = 'QaimaSystemDB', DB_VERSION = 1;
        let db;
        const initDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = e => {
                let db = e.target.result;
                if(!db.objectStoreNames.contains('quotes')) db.createObjectStore('quotes', {keyPath: 'id'});
                if(!db.objectStoreNames.contains('clients')) db.createObjectStore('clients', {keyPath: 'name'});
                if(!db.objectStoreNames.contains('products')) db.createObjectStore('products', {keyPath: 'name'});
                if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath: 'id'});
            };
            req.onsuccess = e => { db = e.target.result; resolve(db); };
            req.onerror = e => reject(e);
        });
        const dbOp = (storeName, mode, op, data) => new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, mode);
            const store = tx.objectStore(storeName);
            let req;
            if(op === 'put') req = store.put(data);
            else if(op === 'get') req = store.get(data);
            else if(op === 'getAll') req = store.getAll();
            else if(op === 'delete') req = store.delete(data);
            else if(op === 'clear') req = store.clear();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        // State variables
        let quotes = [], clients = [], products = [], settings = {};
        let currentQuoteId = null;
        let autoSaveTimer = null;
        let historyStack = [], historyIndex = -1;

        // Utility
        const qs = s => document.querySelector(s);
        const showToast = msg => {
            const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
            qs('#toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };
        const getToday = () => new Date().toISOString().split('T')[0];

        // Init App
        window.onload = async () => {
            await initDB();
            settings = await dbOp('settings', 'readonly', 'get', 'main') || { id: 'main', logo: '', name: '', address: '', phone: '', email: '', lastQuoteNum: 0 };
            quotes = await dbOp('quotes', 'readonly', 'getAll');
            clients = await dbOp('clients', 'readonly', 'getAll');
            products = await dbOp('products', 'readonly', 'getAll');
            
            // Theme setup
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

            updateDatalists();
            applySettingsToUI();
            
            quotes.sort((a,b) => new Date(b.date) - new Date(a.date));
            if(quotes.length > 0) loadQuote(quotes[0].id);
            else createNewQuote();
            
            renderSidebar();
        };

        // Theme Toggle
        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        // Settings Logic
        const applySettingsToUI = () => {
            qs('#c_name').value = settings.name || '';
            qs('#c_address').value = settings.address || '';
            qs('#c_phone').value = settings.phone || '';
            qs('#c_email').value = settings.email || '';
            if(settings.logo) {
                qs('#c_logo_img').src = settings.logo;
                qs('#c_logo_img').style.display = 'block';
            } else {
                qs('#c_logo_img').style.display = 'none';
            }
        };
        const openSettings = () => {
            qs('#set_name').value = settings.name || '';
            qs('#set_addr').value = settings.address || '';
            qs('#set_phone').value = settings.phone || '';
            qs('#set_email').value = settings.email || '';
            qs('#settingsModal').classList.add('active');
        };
        const closeSettings = () => qs('#settingsModal').classList.remove('active');
        const uploadLogo = e => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => { settings.logo = e.target.result; };
                reader.readAsDataURL(file);
            }
        };
        const saveSettings = async () => {
            settings.name = qs('#set_name').value;
            settings.address = qs('#set_addr').value;
            settings.phone = qs('#set_phone').value;
            settings.email = qs('#set_email').value;
            await dbOp('settings', 'readwrite', 'put', settings);
            applySettingsToUI();
            closeSettings();
            showToast('Ayarlar yadda saxlanıldı');
        };

        // Quote Logic
        const generateQuoteId = () => {
            settings.lastQuoteNum = (settings.lastQuoteNum || 0) + 1;
            dbOp('settings', 'readwrite', 'put', settings);
            return `QT-${String(settings.lastQuoteNum).
